# The smallest fleet: one machine, one project, a plan bot and a dev bot. No courier, no
# guard; `fleet doctor` by hand replaces the guard at first. Facts only, never a key or a token.

[fleet]
name = "erik"
owner = "example"                 # merges, sets ready anywhere, decides

[machines.box]
role = "bots"
family = "arch"                      # arch | nixos
home_root = "/srv"
scratch_root = "/data"

[stacks.python-uv]
test = "uv sync; uv run ruff check; uv run pytest"
allow = ["uv sync*", "uv lock*", "uv run ruff *", "uv run pytest*"]
env = { UV_CACHE_DIR = "{scratch}/uv-cache", UV_LINK_MODE = "copy" }

# No [labels] table: `fleet labels myapp` uses the kit's defaults (ready, needs-haku, next, live,
# size:S/M/L, bot:<name>). `reviews = 1` would ask for a ruleset on main (`fleet ruleset myapp`).

[projects.myapp]
repo = "example/myapp"
stacks = ["python-uv"]
ci = "auto"                          # yes | no | auto: auto looks for .github/workflows
plan = { name = "myapp-plan" }
dev  = { name = "myapp-dev" }
