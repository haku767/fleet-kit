[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-kit"
version = "0.1.0"
description = "One fleet.toml and a fleet command around it: set up and watch a fleet of Claude Code bots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fleet = "fleet_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_kit = ["data/*"]
